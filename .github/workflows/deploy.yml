name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Fetch fresh Crowd Supply stats and redeploy every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Sync Crowd Supply campaign stats
        run: |
          node scripts/sync-crowd-supply.mjs || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/config/crowd-supply.generated.json
          if git diff --cached --quiet; then
            echo "No campaign data changes"
          else
            git commit -m "chore: auto-sync Crowd Supply campaign stats"
            git push
          fi

      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
